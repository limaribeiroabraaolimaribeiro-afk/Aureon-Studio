<style>

</style></head><body><header><div class="logo"><svg viewBox="0 0 36 30" fill="none" stroke="currentColor" stroke-width="3"><path d="M1 22C9 26 7 4 13 5S18 27 22 25 25 2 30 5 32 22 35 21"/></svg>AUREON</div><nav class="topnav" id="top"></nav><div class="statusbar"><span>CPU —</span><span><i class="dot off"></i>Áudio não iniciado</span><span><i class="dot off"></i>MIDI</span></div></header><div class="layout"><aside id="side"></aside><main id="main"></main></div><div id="toast" class="toast hidden" role="status"></div>
<script>
'use strict';
const pages=['Início','Biblioteca','Designer','Efeitos','Ao Vivo','Arpejador','Downloads','Configurações'];
const paths=['M3 10 12 3l9 7v11h-6v-7H9v7H3z','M3 5h7l2 3h9v12H3z','M2 13h4l3-8 4 15 3-10 2 3h4','M3 6h18M3 12h18M3 18h18M8 3v6M16 9v6M10 15v6','M6 3l15 9-15 9z','M5 5h1m5 0h1m5 0h1M5 12h1m5 0h1m5 0h1M5 19h1m5 0h1m5 0h1','M12 3v13m-5-5 5 5 5-5M3 16v5h18v-5','M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2'];
const icon=i=>'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="'+paths[i]+'"/></svg>';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem('aureon.'+k))??d}catch{return d}};
const save=(k,v)=>{try{localStorage.setItem('aureon.'+k,JSON.stringify(v))}catch{}};
const sounds=[['Piano Grand Moderno','Pianos','Acústico','Grand'],['Felt Piano','Pianos','Acústico','Suave'],['Electric Piano','Pianos','Elétrico','Vintage'],['Pad Atmosférico','Pads','Sintético','Amplo'],['Worship Pad','Pads','Sintético','Ambiente'],['Strings Ensemble','Strings','Acústico','Orquestral'],['Pipe Organ','Órgãos','Acústico','Pipe'],['Synth Lead Vintage','Synths','Sintético','Vintage']];
let state={page:0,cat:'Todos',query:'',selected:0,favorites:read('favorites',[]),layers:read('layers',[{name:'Grand Piano',kind:0,vol:100,on:true},{name:'Pad Ambient',kind:3,vol:45,on:true},{name:'Warm Strings',kind:5,vol:28,on:true}]),preset:read('preset','Piano Worship'),bpm:120,transpose:0,scene:0,split:false,effect:0,fx:[true,true,true,true,true,true],steps:Array.from({length:16},(_,i)=>i%3!==1),acc:Array.from({length:16},(_,i)=>i%4===0),slide:Array(16).fill(false),tie:Array(16).fill(false),theme:read('theme','Claro'),filterFav:false};
const categories=['Todos','Pianos','Pads','Strings','Órgãos','Synths','Outros'];
const svgImage=(i)=>{const palette=['#8c775c','#b4a38b','#52626c','#438eac','#3b7695','#a56435','#8c7353','#495661'];let c=palette[i%8];let art=i===3||i===4?'<path d="M0 70Q25 28 55 58T110 36T180 58V110H0Z" fill="#a3d5e2"/><path d="M0 85Q40 45 75 76T180 48V110H0Z" fill="#4c829a"/>':i===5?'<ellipse cx="85" cy="62" rx="23" ry="37" fill="#b57140" stroke="#e7bd82" stroke-width="3"/><path d="M85 5v95M76 48l18 0" stroke="#292321" stroke-width="5"/>':i===6?Array.from({length:9},(_,k)=>'<rect x="'+(28+k*14)+'" y="'+(13+Math.abs(k-4)*6)+'" width="10" height="'+(80-Math.abs(k-4)*6)+'" rx="4" fill="#c4aa78"/>').join(''):'<path d="M15 39 145 19 168 55 38 79Z" fill="#212830" stroke="#9aa9af"/>'+Array.from({length:15},(_,k)=>'<rect x="'+(22+k*9)+'" y="63" width="8" height="32" rx="1" fill="#f4f4ee"/>'+ (k%7!==2&&k%7!==6?'<rect x="'+(27+k*9)+'" y="63" width="5" height="19" fill="#25282b"/>':'')).join('');return 'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 110"><defs><linearGradient id="g"><stop stop-color="'+c+'"/><stop offset="1" stop-color="#162833"/></linearGradient></defs><rect width="180" height="110" fill="url(#g)"/>'+art+'</svg>')};
const thumb=(i)=>'<img class="thumb" alt="" src="'+svgImage(i)+'">';
const wave=()=>'<svg class="wave" viewBox="0 0 200 28" preserveAspectRatio="none" aria-hidden="true">'+Array.from({length:65},(_,i)=>{let h=2+Math.abs(Math.sin(i*1.73)*Math.cos(i*.073))*23;return '<path d="M'+(i*3+2)+' '+(14-h/2)+'v'+h+'" stroke="currentColor" opacity="'+(1-i/90)+'" stroke-width="1.3"/>'}).join('')+'</svg>';
const title=(a,b)=>'<div class="heading"><h1>'+a+'</h1><p>'+b+'</p><svg viewBox="0 0 320 75"><path d="M0 66Q70 20 120 49T230 27T320 48" fill="none" stroke="#40a4b7" stroke-width="21"/><path d="M0 61Q70 15 120 44T230 22T320 43" fill="none" stroke="#86d0df" stroke-width="3"/></svg></div>';
const card=(h,c,extra='')=>'<section class="card '+extra+'">'+(h?'<h2>'+h+'</h2>':'')+c+'</section>';
const btn=(t,a,cls='')=>'<button class="'+cls+'" data-action="'+a+'">'+t+'</button>';
const toggle=(on,a)=>'<button class="toggle '+(on?'on':'')+'" aria-label="Alternar" aria-pressed="'+on+'" data-action="'+a+'"></button>';
const options=(arr,value)=>'<select>'+arr.map(s=>'<option '+(s===value?'selected':'')+'>'+esc(s)+'</option>').join('')+'</select>';
const field=(t,c)=>'<label class="field"><span>'+t+'</span>'+c+'</label>';
const range=(v,key='')=>'<input type="range" min="0" max="100" value="'+v+'" data-range="'+key+'" aria-label="'+(key||'Ajuste')+'">';
const knob=(n,v,unit='%')=>'<div class="knob" style="--v:'+v+'"><div class="dial"></div><strong>'+n+'</strong><span class="sub knobval">'+v+unit+'</span><input type="range" min="0" max="100" value="'+v+'" data-knob="'+unit+'" aria-label="'+n+'"></div>';
const keyboard=(zones=false)=>'<div class="keyboard" aria-label="Teclado virtual visual">'+Array.from({length:52},(_,i)=>'<button class="key '+(zones?(i<26?'zone':'zone2'):'')+'" data-key="'+i+'" aria-label="Tecla '+(i+1)+'">'+(i%7!==2&&i%7!==6&&i<51?'<span class="black"></span>':'')+(i%7===0?'C'+(Math.floor(i/7)+1):'')+'</button>').join('')+'</div>';
const keyboardCard=(zones=false)=>card('', '<div class="keyboard-wrap"><div><h2>'+ (zones?'Teclado / Zonas (Split)':'Teclado Virtual')+'</h2>'+field(zones?'Ponto de split':'Teclas',options(zones?['C3','C4','C5']:['88 teclas','61 teclas'],'C4'))+'<div class="row item"><small>Sustentação</small>'+toggle(false,'generic')+'</div></div>'+keyboard(zones)+'</div>');
const chart=(type='adsr')=>{let d=type==='filter'?'M0 35H180Q230 35 250 85L300 140':type==='velocity'?'M0 140Q200 130 300 10':'M0 140L40 20L85 25Q110 49 150 49H220Q240 100 300 140';return '<svg class="chart" viewBox="0 0 300 145" preserveAspectRatio="none"><path d="'+d+' L300 145H0Z" fill="#6ac0ca" opacity=".23"/><path d="'+d+'" fill="none" stroke="#208d99" stroke-width="2.5"/></svg>'};
const meters=()=>'<div class="row"><small>L</small><div class="meter idle"></div><small>— dB</small></div><div class="row" style="margin-top:5px"><small>R</small><div class="meter idle"></div><small>— dB</small></div>';
const layers=()=>'<div class="layers">'+state.layers.map((l,i)=>'<div class="item">'+toggle(l.on,'layer:'+i)+thumb(l.kind)+'<div><strong>'+esc(l.name)+'</strong><div class="sub">Camada '+(i+1)+'</div></div>'+range(l.vol,'layer:'+i)+'<small class="layer-val">'+l.vol+'%</small>'+btn('⋯','removeLayer:'+i,'ghost')+'</div>').join('')+'</div>';
function home(){return title('Bem-vindo ao AUREON','Seu ambiente completo para sons, criação, performance e produção musical.')+'<div class="grid g3">'+card('CPU','<div class="big">—</div><div class="bar"><i style="width:0%"></i></div>')+card('Motor de Áudio','<div class="row between"><span><i class="dot off"></i>Não iniciado</span><small>Protótipo visual</small></div>')+card('Conexão MIDI','<div class="row between"><span><i class="dot off"></i>Desconectado</span>'+btn('Configurar','nav:7')+'</div>')+'</div><div class="grid g2">'+card('', '<div class="hero">'+thumb(0)+'<div><h2>Biblioteca de Sons</h2><p>Explore, organize e carregue seus instrumentos, sample packs e expansões.</p>'+btn('Abrir Biblioteca →','nav:1','primary')+'</div></div>')+card('', '<div class="hero">'+thumb(4)+'<div><h2>Modo Ao Vivo</h2><p>Configure timbres, camadas e setlists para suas performances no palco.</p>'+btn('Iniciar Modo Ao Vivo →','nav:4','primary')+'</div></div>')+'</div><div class="grid g3">'+card('Projetos Recentes',['Culto Principal.aurn','Produção Musical.aurn','Ideias de Arranjo.aurn'].map(s=>'<div class="item row">'+icon(1)+'<div><strong>'+s+'</strong><div class="sub">Exemplo de projeto</div></div></div>').join(''))+card('Presets Recentes',[0,3,7].map(i=>'<div class="item row">'+thumb(i)+'<div class="grow"><strong>'+sounds[i][0]+'</strong><div class="sub">'+sounds[i][1]+'</div></div>'+btn('›','sound:'+i,'ghost')+'</div>').join(''))+card('Status MIDI','<div class="notice">Nenhum controlador conectado</div><div class="item row between">Entradas ativas <b>—</b></div><div class="item row between">Saídas ativas <b>—</b></div><div class="item">Mensagens (tempo real)<br><small>Aguardando motor MIDI</small></div>')+'</div>'+keyboardCard()}
function library(){let ids=sounds.map((s,i)=>i).filter(i=>(state.cat==='Todos'||sounds[i][1]===state.cat)&&(!state.filterFav||state.favorites.includes(i))&&sounds[i].join(' ').toLowerCase().includes(state.query.toLowerCase()));let i=state.selected,s=sounds[i];return title('Biblioteca de Sons','Explore, busque e organize presets, instrumentos e expansões da AUREON.')+'<div class="row" style="margin-bottom:12px"><input id="search" class="grow" placeholder="Buscar sons, tags ou expansões..." value="'+esc(state.query)+'">'+btn('Importar','import')+'</div><div class="tabs">'+categories.map(c=>btn(c,'cat:'+c,c===state.cat?'selected':'')).join('')+'</div><div class="library">'+card('Minhas bibliotecas',btn('Todos os sons','all','ghost')+btn('Favoritos','favorites',state.filterFav?'selected':'ghost')+btn('Baixados','nav:6','ghost')+btn('Expansões','nav:6','ghost')+'<hr><h3>Filtros</h3><strong>Categoria</strong>'+categories.slice(1).map(c=>'<label class="checkline"><input type="radio" name="category" data-cat="'+c+'" '+(c===state.cat?'checked':'')+'>'+c+'</label>').join('')+'<hr><strong>Tipo</strong>'+['Acústico','Elétrico','Sintético','Híbrido'].map(c=>'<label class="checkline"><input type="checkbox">'+c+'</label>').join(''))+'<section><div class="row between item"><small>'+ids.length+' sons de exemplo</small>'+options(['Mais populares','Nome'],'Mais populares')+'</div><div class="soundgrid">'+(ids.length?ids.map(j=>'<div class="card sound '+(i===j?'chosen':'')+'" data-action="select:'+j+'"><div class="row">'+thumb(j)+'<div class="grow"><strong>'+sounds[j][0]+'</strong><div><span class="pill">'+sounds[j][1]+'</span></div></div>'+btn(state.favorites.includes(j)?'♥':'♡','fav:'+j,'fav '+(state.favorites.includes(j)?'on':''))+'</div><div class="row">'+btn('▶','preview:'+j,'play')+wave()+'</div></div>').join(''):'<div class="empty">Nenhum timbre encontrado.</div>')+'</div></section>'+card('', '<div class="row">'+thumb(i)+'<h2>'+s[0]+'</h2></div><div class="row item">'+btn('▶','preview:'+i,'play')+wave()+'</div><div class="item row between">Categoria <b>'+s[1]+'</b></div><div class="item row between">Tipo <b>'+s[2]+'</b></div><div class="item row between">Formato <small>A definir</small></div><div class="item"><h3>Descrição</h3><p class="muted">Instrumento de referência para a biblioteca do Aureon.</p></div><h3>Ações rápidas</h3><div class="stack">'+btn('Carregar no Designer','load:'+i,'primary')+btn('Adicionar à Camada','add:'+i)+btn('Mostrar na Expansão','nav:6')+'</div>')+'</div>'}
function designer(){return title('Designer de Timbres','Crie, edite e personalize sons com camadas, síntese, filtros, modulação e LFO.')+card('', '<div class="row wrap">'+thumb(0)+'<div class="grow"><small>Preset em edição</small><input id="presetName" value="'+esc(state.preset)+'"></div>'+btn('Salvar','savePreset','primary')+btn('Duplicar','duplicate')+'<div class="grow">'+meters()+'</div></div>')+'<div class="tabs" style="margin-top:14px">'+['Camadas','Síntese','Filtro','Modulação','LFO'].map((s,i)=>btn(s,'tab',''+(i===0?'selected':''))).join('')+'</div><div class="grid g2">'+card('Camadas do Timbre','<div class="row between"><small>Combine instrumentos</small>'+btn('+ Adicionar Camada','nav:1')+'</div>'+layers())+card('Envelope (ADSR) — Camada selecionada',chart()+ '<div class="knobs">'+knob('Ataque',8,' ms')+knob('Decay',42)+knob('Sustentação',65)+knob('Release',25)+'</div>')+'</div><div class="grid g3">'+card('Filtro',options(['Passa-baixas (LP24)','Passa-altas','Passa-banda'])+chart('filter')+'<div class="knobs">'+knob('Corte',52)+knob('Ressonância',32)+'</div>')+card('Modulação','<div class="fields">'+field('Fonte',options(['LFO 1','Envelope','Velocity']))+field('Destino',options(['Corte do filtro','Volume','Pitch']))+field('Profundidade',range(22))+'</div>')+card('LFO 1','<div class="fields">'+field('Forma de onda',options(['Seno','Triângulo','Quadrada']))+'</div><div class="knobs">'+knob('Taxa',25)+knob('Fade In',0)+knob('Fase',0)+'</div>')+'</div><div class="grid wide">'+card('Mapa do Teclado (Zona)',layers())+card('Curva de Velocidade',chart('velocity'))+'</div>'+keyboardCard()}
const fxNames=['Reverb','Delay','Chorus','Compressor','EQ','Shimmer'];
function effects(){return title('Estação de Efeitos','Crie, edite e organize cadeias de efeitos para seus sons, instrumentos e performances.')+card('', '<div class="row wrap"><div class="grow"><small>Cadeia de efeitos</small><br>'+options(['Pad Atmosférico FX','Piano Worship FX'])+'</div>'+btn('Salvar','savePreset')+btn('Salvar como','duplicate')+btn('Redefinir','resetFx')+toggle(true,'generic')+' Cadeia ativa '+btn('Bypass Global','bypass')+'</div>')+'<div style="height:14px"></div>'+card('Cadeia de Efeitos','<div class="effects">'+fxNames.map((s,i)=>'<div class="card effect '+(i===state.effect?'chosen':'')+'"><button class="ghost" data-action="effect:'+i+'">'+s+'</button><div>'+toggle(state.fx[i],'fx:'+i)+'</div></div>').join('')+'</div>')+'<div style="height:14px"></div><div class="grid wide">'+card(fxNames[state.effect],'<div class="row between">'+options(['Hall Espaçoso','Plate Suave','Sala Pequena'])+toggle(state.fx[state.effect],'fx:'+state.effect)+'</div><svg class="chart dark" viewBox="0 0 300 100" preserveAspectRatio="none">'+Array.from({length:140},(_,i)=>'<path d="M'+(i*2.15)+' 95v-'+(Math.exp(-i/35)*(20+Math.abs(Math.sin(i*1.9))*70))+'" stroke="#52d4e2" stroke-width="1"/>').join('')+'</svg><div class="knobs">'+['Decay','Mix','Tom','Pré-atraso','Damping'].map((n,i)=>knob(n,[60,28,72,24,42][i])).join('')+'</div>')+card('Presets de Efeitos',['Hall Espaçoso','Plate Suave','Ambiente Grande','Sala Pequena','Névoa Shimmer'].map(s=>'<div class="item row between">'+s+btn('☆','generic','ghost')+'</div>').join(''))+'</div><div class="grid g3">'+card('Feedback em Tempo Real','<div class="notice">Aguardando sinal de áudio</div>'+wave())+card('Controles da Cadeia',field('Nível',range(75))+field('Mix (Paralelo)',range(100))+field('Stereo',range(60)))+card('Saída Mestre',meters()+field('Limiter',toggle(true,'generic'))+range(75))+'</div>'}
function live(){return title('Ao Vivo','Modo de performance para uso no palco. Controle seus sons, cenas e efeitos em tempo real.')+'<div class="grid wide">'+card('Preset Atual','<div class="row between"><div class="big">'+esc(state.preset==='Piano Worship'?'Piano + Pad + Strings (Palco)':state.preset)+'</div>'+btn('‹','scenePrev')+btn('›','sceneNext')+'</div>')+card('Conexão MIDI','<i class="dot off"></i>Desconectado')+'</div><div class="grid g3">'+card('BPM','<div class="row"><span class="big grow">'+state.bpm+'</span>'+btn('−','bpm:-1')+btn('+','bpm:1')+btn('Tap','tap')+'</div>')+card('Transposição','<div class="row"><span class="big grow">'+state.transpose+' st</span>'+btn('−','trans:-1')+btn('+','trans:1')+'</div>')+card('Split / Layer','<div class="tabs">'+btn('Layer','split:0',!state.split?'selected':'')+btn('Split','split:1',state.split?'selected':'')+'</div>')+'</div><div class="grid wide">'+card('Camadas (Layers)',layers()+btn('+ Adicionar camada','nav:1'))+'<div class="stack">'+card('Volume Principal','<div class="knobs">'+knob('Master',75)+'</div>')+card('Efeitos Globais','<div class="knobs">'+knob('Reverb',35)+knob('Delay',18)+knob('Chorus',25)+'</div>')+'</div></div><div class="grid wide">'+card('Cenas Rápidas','<div class="tabs">'+['Principal','Verso (Leve)','Refrão (Aberto)','Ponte (Pad)','Final (Épico)'].map((s,i)=>btn((i+1)+' '+s,'scene:'+i,i===state.scene?'selected':'')).join('')+'</div>')+card('Set / Cena',field('Set',options(['Culto Principal','Ensaio']))+field('Cena',options(['Principal','Verso','Refrão','Ponte','Final'],['Principal','Verso','Refrão','Ponte','Final'][state.scene])))+'</div>'+keyboardCard(true)}
function arp(){return title('Arpejador','Crie arpejos expressivos e padrões rítmicos personalizados para suas músicas.')+'<div class="grid g3">'+card('Arpejador','<div class="row between">Ativar '+toggle(false,'generic')+'</div>')+card('BPM','<div class="row"><b class="big grow">'+state.bpm+'</b>'+btn('−','bpm:-1')+btn('+','bpm:1')+'</div>')+card('Divisão / Relógio MIDI',options(['1/16','1/8','1/4','1/32'])+' '+options(['Interno','Externo']))+'</div><div class="grid g2">'+card('Editor de Padrão (Passos)','<div class="steps"><span></span>'+Array.from({length:16},(_,i)=>'<span style="text-align:center">'+(i+1)+'</span>').join('')+[['Ativo','steps'],['Acento','acc'],['Slide','slide'],['Ligado','tie']].map(([name,k])=>'<span>'+name+'</span>'+state[k].map((v,i)=>btn('','step:'+k+':'+i,'step '+(v?(k==='acc'?'accent':'on'):''))).join('')).join('')+'</div>')+card('Padrão de Notas','<svg class="chart" viewBox="0 0 320 145">'+Array.from({length:16},(_,i)=>'<path d="M'+(i*20+2)+' '+(72-Math.sin(i*.55)*50)+'h16" stroke="#299e9f" stroke-width="5" stroke-linecap="round"/>').join('')+'</svg>')+'</div><div class="grid wide">'+card('Controles do Arpejador','<div class="grid g2"><div class="fields">'+field('Oitavas',options(['1','2','3','4'],'2'))+field('Swing',range(16))+field('Velocity',range(100))+'</div><div class="fields">'+field('Direção',options(['Ascendente','Descendente','Aleatório']))+field('Gate',range(80))+field('Latch',toggle(false,'generic'))+'</div></div>')+card('Padrões Pré-definidos',['Arpejo Clássico (1/16)','Rítmico Moderno','Pulsante (1/8)','Ascending 4'].map((s,i)=>'<div class="item">'+btn(s,'pattern:'+i,'ghost')+'</div>').join(''))+'</div><div class="row wrap item">'+btn('Salvar Padrão','savePattern')+btn('Carregar Padrão','loadPattern')+btn('Salvar como Preset','savePreset')+'</div>'+keyboardCard()}
function downloads(){const packs=[['Piano Grand Moderno',0,'Pianos acústicos de estúdio'],['Pads Atmosféricos',3,'Texturas envolventes e ambientes'],['Synth Lead Vintage',7,'Leads clássicos e expressivos'],['Strings Sinfônicas',5,'Cordas orquestrais'],['Órgãos Clássicos',6,'Órgãos de tubo e elétricos']];return title('Downloads','Expansões, coleções de sons e conteúdos adicionais para o AUREON.')+'<div class="tabs">'+['Biblioteca de Expansões','Meus Downloads','Instalados'].map((s,i)=>btn(s,'tab',i===0?'selected':'')).join('')+'</div><div class="grid wide"><div><div class="tabs">'+categories.slice(1).map(c=>btn(c,'tab')).join('')+'</div><h2>Expansões Recomendadas</h2><div class="grid g3">'+packs.slice(0,3).map(p=>card('',thumb(p[1])+'<h3>'+p[0]+'</h3><p class="muted">'+p[2]+'</p>'+btn('Ver biblioteca','nav:1','primary'),'download-card')).join('')+'</div>'+card('Todas as Expansões e Coleções',packs.map(p=>'<div class="item row">'+thumb(p[1])+'<div class="grow"><strong>'+p[0]+'</strong><div class="sub">'+p[2]+'</div></div>'+btn('Detalhes','nav:1')+'</div>').join(''))+'</div><div class="stack">'+card('Armazenamento','<div class="big">— GB</div><div class="bar"></div><p class="muted">Gerenciamento local a implementar.</p>')+card('Conteúdo Instalado','<div class="big">0</div><small>expansões instaladas</small>')+card('Atualizações Disponíveis','<p class="muted">Catálogo ainda não conectado.</p>')+card('Importar Sample Pack','<p class="muted">WAV, SFZ ou pacote AUREON.</p>'+btn('Selecionar arquivo / pasta…','import','primary'))+'</div></div>'}
function settings(){return title('Configurações','Ajuste o AUREON ao seu fluxo de trabalho, dispositivo e preferências.')+'<div class="tabs">'+['Áudio','MIDI','Desempenho','Interface','Sistema'].map((s,i)=>btn(s,'tab',i===0?'selected':'')).join('')+'</div><div class="grid g2">'+card('Configuração de Áudio','<div class="fields">'+field('Driver de áudio',options(['WASAPI','ASIO']))+field('Taxa de amostragem',options(['44,1 kHz','48 kHz','96 kHz']))+field('Tamanho do Buffer',options(['128 samples','256 samples','512 samples'],'256 samples'))+field('Dispositivo de Saída',options(['Saída padrão do Windows']))+'<div class="notice">Latência: não medida</div></div>')+card('Dispositivos MIDI e Mapeamento','<div class="row between"><small>Dispositivos conectados</small>'+btn('Detectar Dispositivos','midi')+'</div><div id="midiResults" class="empty">Nenhum dispositivo detectado nesta interface.</div><div class="item">Korg Kross 1 — controlador previsto</div>')+card('Pedais',field('Pedal Sustain · CC64',options(['Sustain','Desativado']))+field('Pedal Expressão · CC11',options(['Expressão','Volume','Desativado'])))+card('Tema','<div class="tabs">'+['Claro','Escuro','Automático'].map(s=>btn(s,'theme:'+s,state.theme===s?'selected':'')).join('')+'</div>')+card('Salvar Automaticamente',field('Ativar',toggle(true,'generic'))+field('Intervalo',options(['5 minutos','10 minutos','15 minutos']))+field('Máximo de versões',options(['10 versões','20 versões','50 versões'])))+card('Diagnóstico','<div class="item">Áudio — motor não implementado</div><div class="item">MIDI — detecção opcional do navegador</div><div class="item">Desempenho — não medido</div><div class="item">Sistema — protótipo de interface</div>'+btn('Executar Diagnóstico','diagnostic'))+'</div>'}
const views=[home,library,designer,effects,live,arp,downloads,settings];
function render(){document.body.classList.toggle('dark',state.theme==='Escuro'||(state.theme==='Automático'&&matchMedia('(prefers-color-scheme: dark)').matches));const nav=(i)=>'<button data-action="nav:'+i+'" class="'+(i===state.page?'active':'')+'" '+(i===state.page?'aria-current="page"':'')+'>'+icon(i)+'<span>'+pages[i]+'</span></button>';document.querySelector('#top').innerHTML=[0,1,2,3,4,5].map(nav).join('');document.querySelector('#side').innerHTML=pages.map((_,i)=>nav(i)).join('')+'<footer><b>AUREON</b><br><small>v0.1 · Design preview</small></footer>';document.querySelector('#main').innerHTML=views[state.page]();}
let timer;function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>t.classList.add('hidden'),2800)}
let lastTap=0;
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el)return;const [a,b,c]=el.dataset.action.split(':');let i=Number(b);switch(a){case'nav':state.page=i;location.hash=String(i);break;case'cat':state.cat=b;break;case'all':state.filterFav=false;state.cat='Todos';break;case'favorites':state.filterFav=!state.filterFav;break;case'select':state.selected=i;break;case'sound':state.selected=i;state.page=1;break;case'fav':state.favorites=state.favorites.includes(i)?state.favorites.filter(x=>x!==i):[...state.favorites,i];save('favorites',state.favorites);break;case'load':state.preset=sounds[i][0];state.layers=[{name:sounds[i][0],kind:i,vol:100,on:true}];state.page=2;break;case'add':if(state.layers.length>=4){toast('Limite de quatro camadas no protótipo.');return}state.layers.push({name:sounds[i][0],kind:i,vol:50,on:true});state.page=2;break;case'layer':state.layers[i].on=!state.layers[i].on;break;case'removeLayer':state.layers.splice(i,1);break;case'savePreset':state.preset=document.querySelector('#presetName')?.value||state.preset;save('preset',state.preset);save('layers',state.layers);toast('Configuração visual salva neste navegador.');break;case'duplicate':state.preset+=' (cópia)';break;case'bpm':state.bpm=Math.max(20,Math.min(300,state.bpm+i));break;case'tap':{let now=performance.now();if(lastTap&&now-lastTap<3000)state.bpm=Math.max(20,Math.min(300,Math.round(60000/(now-lastTap))));lastTap=now;break}case'trans':state.transpose=Math.max(-24,Math.min(24,state.transpose+i));break;case'scene':state.scene=i;break;case'scenePrev':state.scene=(state.scene+4)%5;break;case'sceneNext':state.scene=(state.scene+1)%5;break;case'split':state.split=!!i;break;case'effect':state.effect=i;break;case'fx':state.fx[i]=!state.fx[i];break;case'resetFx':state.fx=fxNames.map(()=>true);break;case'bypass':state.fx=fxNames.map(()=>false);break;case'step':state[b][Number(c)]=!state[b][Number(c)];break;case'pattern':state.steps=state.steps.map((_,j)=>j%(i+2)!==1);break;case'savePattern':save('pattern',state.steps);toast('Padrão visual salvo.');return;case'loadPattern':state.steps=read('pattern',state.steps);break;case'theme':state.theme=b;save('theme',b);break;case'tab':el.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');return;case'generic':if(el.classList.contains('toggle')){el.classList.toggle('on');el.setAttribute('aria-pressed',el.classList.contains('on'));}return;case'preview':toast('Prévia de áudio ainda não implementada.');return;case'import':toast('Importador de samples ainda não implementado.');return;case'diagnostic':toast('Motor de áudio nativo ainda não implementado.');return;case'midi':{const out=document.querySelector('#midiResults');try{if(!navigator.requestMIDIAccess)throw Error('Web MIDI indisponível');const m=await navigator.requestMIDIAccess({sysex:false});out.textContent=[...m.inputs.values()].map(x=>x.name).join(', ')||'Nenhum dispositivo encontrado.'}catch{out.textContent='Não foi possível acessar MIDI neste navegador.'}return}default:return}render()});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='search'){state.query=t.value;let pos=t.selectionStart;render();const n=document.querySelector('#search');n.focus();n.setSelectionRange(pos,pos)}if(t.dataset.range?.startsWith('layer:')){let i=Number(t.dataset.range.split(':')[1]);state.layers[i].vol=Number(t.value);t.parentElement.querySelector('.layer-val').textContent=t.value+'%'}if(t.dataset.knob!==undefined){t.parentElement.style.setProperty('--v',t.value);t.parentElement.querySelector('.knobval').textContent=t.value+t.dataset.knob}});
document.addEventListener('change',e=>{if(e.target.dataset.cat){state.cat=e.target.dataset.cat;render()}if(e.target.id==='presetName')state.preset=e.target.value});
document.addEventListener('pointerdown',e=>e.target.closest('.key')?.classList.add('pressed'));document.addEventListener('pointerup',()=>document.querySelectorAll('.key.pressed').forEach(k=>k.classList.remove('pressed')));document.addEventListener('pointercancel',()=>document.querySelectorAll('.key.pressed').forEach(k=>k.classList.remove('pressed')));
function route(){let n=Number(location.hash.slice(1));if(Number.isInteger(n)&&n>=0&&n<8){state.page=n;render()}}window.addEventListener('hashchange',route);route();render();
</script></body></html>
